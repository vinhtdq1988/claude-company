server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Header bảo mật cho mọi phản hồi. Giá trị CSP phải khớp WEB_CSP trong apps/api/src/platform/http/security.ts
  # (test security-http.spec.ts kiểm hai bản). Không đặt `add_header` trong các location bên dưới, vì nginx sẽ
  # bỏ qua các header ở cấp server khi location có `add_header` riêng.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # `proxy_pass` không có URI để giữ nguyên đường dẫn `/api/v1/...` mà API đang phục vụ.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # nginx đặt lại các header bảo mật ở cấp server; bỏ bản của API để không bị lặp.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Permissions-Policy;
  }

  # Socket.IO: client kết nối namespace `/realtime` qua đường dẫn HTTP mặc định `/socket.io/`.
  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
