# Môi trường chạy local: docker compose -f docker/docker-compose.yml --env-file docker/.env up --build
# sandbox-runner và egress-proxy do T111, T111a thêm vào file này.
name: claude-company

x-app-env: &app-env
  MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET là bắt buộc}
  ADAPTER_MODE: ${ADAPTER_MODE:-dry_run}
  WORKSPACE_HOST_PATH: /workspaces
  BUDGET_WARN_THRESHOLD: ${BUDGET_WARN_THRESHOLD:-0.8}
  DEFAULT_MONTHLY_COST_LIMIT_USD: ${DEFAULT_MONTHLY_COST_LIMIT_USD:-20}
  DEFAULT_MONTHLY_TOKEN_LIMIT: ${DEFAULT_MONTHLY_TOKEN_LIMIT:-2000000}
  SDK_BUDGET_HEADROOM: ${SDK_BUDGET_HEADROOM:-0.1}
  SDK_RUN_RESERVE_USD: ${SDK_RUN_RESERVE_USD:-2}
  SDK_RUN_RESERVE_TOKENS: ${SDK_RUN_RESERVE_TOKENS:-200000}
  SDK_RESUME_AFTER_CRASH: ${SDK_RESUME_AFTER_CRASH:-false}
  ARTIFACT_CONTEXT_MAX_BYTES: ${ARTIFACT_CONTEXT_MAX_BYTES:-200000}
  MAX_REWORK: ${MAX_REWORK:-3}
  RUN_TIMEOUT_MS: ${RUN_TIMEOUT_MS:-900000}
  RETRY_MAX: ${RETRY_MAX:-3}
  EGRESS_PROXY_URL: ${EGRESS_PROXY_URL:-}
  SANDBOX_RUNNER_URL: ${SANDBOX_RUNNER_URL:-}
  SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL là bắt buộc}
  DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL là bắt buộc}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD là bắt buộc}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-claude-company-artifacts}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY là bắt buộc}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY là bắt buộc}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claude_company}
      POSTGRES_USER: ${POSTGRES_USER:-cc_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD là bắt buộc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cc_owner} -d ${POSTGRES_DB:-claude_company}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY là bắt buộc}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY là bắt buộc}
    volumes:
      - minio_data:/data
    ports:
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      <<: *app-env
      PORT: '3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ${WORKSPACE_HOST_PATH:-./data/workspaces}:/workspaces:ro
    ports:
      - '127.0.0.1:3000:3000'

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ${WORKSPACE_HOST_PATH:-./data/workspaces}:/workspaces
      - run_worktrees:/var/lib/claude-company/worktrees
      - dry_run_data:/var/lib/claude-company/dry-run

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    depends_on:
      - api
    ports:
      - '127.0.0.1:8080:8080'

volumes:
  postgres_data:
  redis_data:
  minio_data:
  run_worktrees:
  dry_run_data:
